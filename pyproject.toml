[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-brain"
version = "0.1.0"
description = "A local, safety-first AI interface to an Obsidian vault"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1"]
embeddings = ["fastembed>=0.3,<1", "sqlite-vec>=0.1.6,<1"]
benchmark = ["fastembed>=0.3,<1", "sentence-transformers>=3,<4", "sqlite-vec>=0.1.6,<1"]

[project.scripts]
tiny-brain = "tiny_brain.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tiny_brain = ["web/static/*", "web/templates/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
