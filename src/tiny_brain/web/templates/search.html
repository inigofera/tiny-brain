<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | Tiny Brain</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="topbar"><a class="brand" href="/">TINY BRAIN</a><nav><a class="active" href="/ui/search">Search</a><a href="/ui/changes">Changes</a></nav></header><main class="shell compact"><p class="eyebrow">EVIDENCE INDEX</p><h1>Search the vault.</h1><form id="search-form" class="search-form"><input id="query" placeholder="Search exact terms or concepts" required><button>Search <span aria-hidden="true">↗</span></button></form><div id="results"></div></main><script>const form=document.querySelector('#search-form'),out=document.querySelector('#results');form.addEventListener('submit',async e=>{e.preventDefault();const q=document.querySelector('#query').value;const r=await fetch('/search',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q})});const d=await r.json();out.innerHTML=d.results.map(x=>`<article class="result"><div><span class="citation">${x.citation_id}</span><strong>${escapeHtml(x.title)}</strong><small>${escapeHtml(x.path)} · ${escapeHtml(x.heading||'Note')}</small></div><p>${escapeHtml(x.content)}</p><em>${escapeHtml(x.relationship)}</em></article>`).join('')||'<p class="muted">No indexed evidence found.</p>';});function escapeHtml(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}</script></body></html>
