<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Changes | Tiny Brain</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="topbar"><a class="brand" href="/">TINY BRAIN</a><nav><a href="/ui/search">Search</a><a class="active" href="/ui/changes">Changes</a></nav></header><main class="shell compact"><p class="eyebrow">AUDITED MUTATIONS</p><h1>Review changes.</h1><p class="lede">Normal note edits wait here until you approve them.</p><div id="changes"></div></main><script>async function load(){const out=document.querySelector('#changes'),r=await fetch('/changes?state=pending'),items=await r.json();out.innerHTML=items.map(x=>`<article class="change"><div><span class="status">${x.state}</span><strong>${escapeHtml(x.target_path)}</strong><small>${escapeHtml(x.operation)} · ${new Date(x.created_at).toLocaleString()}</small></div><p>${escapeHtml(x.description)}<br><span class="muted">${escapeHtml(x.reason)}</span></p><div class="actions"><button onclick="act('${x.change_id}','approve')">Approve</button><button class="quiet" onclick="act('${x.change_id}','reject')">Reject</button></div></article>`).join('')||'<p class="muted">No pending changes.</p>';}async function act(id,action){await fetch('/changes/'+id+'/'+action,{method:'POST'});load();}function escapeHtml(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}load();</script></body></html>
