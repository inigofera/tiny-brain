services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TINY_BRAIN_VAULT_ROOT: /srv/tiny-brain/vault
      TINY_BRAIN_DATA_ROOT: /srv/tiny-brain/data
      TINY_BRAIN_DATABASE: /srv/tiny-brain/data/database.sqlite
      TINY_BRAIN_MODEL_ROOT: /srv/tiny-brain/models
      TINY_BRAIN_LLAMA_BASE_URL: http://llama:8080/v1
      TINY_BRAIN_RUNTIME_OFFLINE: "true"
      HOME: /srv/tiny-brain/data
    volumes:
      - ${TINY_BRAIN_VAULT_HOST:-/srv/tiny-brain/vault}:/srv/tiny-brain/vault
      - ${TINY_BRAIN_DATA_HOST:-/srv/tiny-brain/data}:/srv/tiny-brain/data
      - ${TINY_BRAIN_MODELS_HOST:-/srv/tiny-brain/models}:/srv/tiny-brain/models:ro
    depends_on:
      llama:
        condition: service_healthy
    networks: [internal]

  llama:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    restart: unless-stopped
    command: [
      "-m", "/models/${TINY_BRAIN_CHAT_MODEL:-gemma-4-E2B-it-q4_0.gguf}",
      "--host", "0.0.0.0",
      "--port", "8080",
      "-c", "${TINY_BRAIN_CONTEXT_TOKENS:-8192}",
      "-t", "${LLAMA_THREADS:-4}",
      "-tb", "${LLAMA_THREADS_BATCH:-4}",
      "-np", "2",
      "--cache-reuse", "64",
      "--spec-type", "ngram-mod",
      "-fa", "on",
      "-ctk", "q8_0",
      "-ctv", "f16",
      "--repack",
      "--load-mode", "mlock",
      "-ngl", "${LLAMA_N_GPU_LAYERS:-0}",
      "--no-webui"
    ]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${TINY_BRAIN_MODELS_HOST:-/srv/tiny-brain/models}:/models:ro
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks: [internal]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TINY_BRAIN_CADDY_DATA_HOST:-/srv/tiny-brain/compose/caddy-data}:/data
      - ${TINY_BRAIN_CADDY_CONFIG_HOST:-/srv/tiny-brain/compose/caddy-config}:/config
    depends_on: [app]
    networks: [internal]

  syncthing:
    image: syncthing/syncthing:1.27
    restart: unless-stopped
    environment:
      PUID: ${TINY_BRAIN_PUID:-1000}
      PGID: ${TINY_BRAIN_PGID:-1000}
    ports:
      - "127.0.0.1:8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - ${TINY_BRAIN_SYNCTHING_CONFIG_HOST:-/srv/tiny-brain/compose/syncthing}:/var/syncthing
      - ${TINY_BRAIN_VAULT_HOST:-/srv/tiny-brain/vault}:/var/syncthing/vault
    networks: [internal]

networks:
  internal:
    driver: bridge
